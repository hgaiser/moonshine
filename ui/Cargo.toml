[package]
name = "moonshine-ui"
version.workspace = true
edition = "2024"
description = "The web control panel of Moonshine."
license = "BSD-2-Clause"

[dependencies]
fec-rs = "0.1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-tungstenite = "0.30.0"
hyper-util = { version = "0.1.20", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std"] }
wtransport = { version = "0.7.2", default-features = false, features = ["aws-lc-rs", "self-signed", "quinn"] }
