[package]
name = "moonshine-ui"
version.workspace = true
edition = "2024"
description = "The web control panel of Moonshine."
license = "BSD-2-Clause"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-tungstenite = "0.30.0"
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std"] }
