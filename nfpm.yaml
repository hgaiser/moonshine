# nfpm configuration — emits .deb, .rpm, and Arch packages from the prebuilt
# binaries. Used by .github/workflows/release.yaml.
#
# VERSION is injected by the release workflow (GITHUB_REF_NAME minus the 'v').

name: pyroshine
arch: amd64 # nfpm maps this to the native architecture for each packager.
platform: linux
version: ${VERSION}
release: "1"
maintainer: "Pyroshine contributors"
description: |
  Pyroshine streaming server for Moonlight clients.
  Includes native PyroWave support.
homepage: "https://github.com/karsyboy/pyroshine"
license: "BSD-2-Clause"
replaces:
  - moonshine
  - moonshine-bin
conflicts:
  - moonshine
  - moonshine-bin

contents:
  - src: ./target/release/moonshine
    dst: /usr/bin/pyroshine
  - src: ./dist/start-pyroshine.sh
    dst: /usr/bin/start-pyroshine.sh
  - src: ./target/release/libmoonshine_wsi.so
    dst: /usr/lib/pyroshine/vulkan-layers/libmoonshine_wsi.so
  - src: ./target/release/libpyrowave-shared.so.0
    dst: /usr/lib/libpyrowave-shared.so.0
  - src: ./dist/60-pyroshine.rules
    dst: /usr/lib/udev/rules.d/60-pyroshine.rules
  - src: ./dist/pyroshine-modules.conf
    dst: /usr/lib/modules-load.d/pyroshine.conf
  - src: ./dist/pyroshine@.service
    dst: /usr/lib/systemd/system/pyroshine@.service
  - src: ./dist/VkLayer_pyroshine_wsi.json
    dst: /usr/share/vulkan/implicit_layer.d/VkLayer_pyroshine_wsi.json
  - src: ./dist/50-pyroshine-inhibit-sleep.rules
    dst: /usr/share/polkit-1/rules.d/50-pyroshine-inhibit-sleep.rules
  - src: ./dist/pyroshine-sysusers.conf
    dst: /usr/lib/sysusers.d/pyroshine.conf
  # License locations differ per distro.
  - src: ./LICENSE
    dst: /usr/share/licenses/pyroshine/LICENSE
    packager: rpm
  - src: ./LICENSE
    dst: /usr/share/doc/pyroshine/copyright
    packager: deb
  - src: ./LICENSE
    dst: /usr/share/licenses/pyroshine/LICENSE
    packager: archlinux

scripts:
  postinstall: ./dist/nfpm/pyroshine-postinstall.sh
  postremove: ./dist/nfpm/pyroshine-postremove.sh

# Dependency names differ per distro.
# (libwayland-client is needed by the WSI layer, which is dlopen'd into games.)
overrides:
  deb:
    depends:
      - libc6
      - libopus0
      - libevdev2
      - libxkbcommon0
      - libgbm1
      - libstdc++6
      - libgcc-s1
      - libwayland-client0
      - xwayland
  rpm:
    depends:
      - glibc
      - opus
      - libevdev
      - libxkbcommon
      - mesa-libgbm
      - libstdc++
      - libgcc
      - libwayland-client
      - xorg-x11-server-Xwayland
  archlinux:
    depends:
      - glibc
      - gcc-libs
      - libdrm
      - libevdev
      - libffi
      - libxkbcommon
      - mesa
      - opus
      - wayland
      - xorg-xwayland
